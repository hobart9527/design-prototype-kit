{
  "id": "high-frequency-editor",
  "title": "明亮高频内容编辑器",
  "description": "准备性案例：检查产品建模、页面必要性、熟悉交互与轻量表达能否共存；不单独证明设计质量。",
  "input": {
    "prompt": "/spec-prototype 基于 PRD 给出完整产品体验模型、页面/表面关系和一个专业推荐。本次只讨论，不制作运行页面；不要为了显得创新而牺牲高频效率。"
  },
  "context": {
    "files": {
      "PRD.md": "社区运营每天批量编辑和排期 30–80 条内容。核心对象是内容条目、渠道版本和排期；桌面端高频使用，户外临时改稿使用手机。需要快速扫描差异、保存草稿、处理冲突并回到原筛选位置。现有品牌明亮、直接、友好，普通表格与抽屉并不被禁止。",
      "DESIGN.md": "现有品牌使用浅色背景、清晰蓝色操作色和普通无衬线字体。它是待评估资产，不代表页面结构或完整设计已经批准。"
    }
  }
}
