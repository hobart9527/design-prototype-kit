{
  "id": "long-form-reader",
  "title": "长篇研究阅读产品",
  "description": "准备性案例：检查内容、阅读旅程、跨表面关系和安静但有辨识度的表达；不单独证明设计质量。",
  "input": {
    "prompt": "/spec-prototype 从 PRD 推导产品设计。先形成可评审的产品模型、Surface Topology 和整合的 Design Proposition；明确哪些页面必要、哪些不必要。本次只讨论，不制作原型。"
  },
  "context": {
    "files": {
      "PRD.md": "研究者阅读 30–120 页政策文档，比较原文、自己的批注和引用来源。核心对象是文档、段落、批注与引用。阅读可能跨多天，需保持位置和未完成批注；手机主要回看而非重度编辑。不得宣称自动判断来源可信度。"
    }
  }
}
