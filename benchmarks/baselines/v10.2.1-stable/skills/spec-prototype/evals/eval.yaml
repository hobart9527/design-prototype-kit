schema_version: v1alpha1
environment:
  type: none
skills:
  - source: local_path
    path: .
    include: [SKILL.md, "references/**", "templates/**", "scripts/**", "agents/**"]
engine:
  name: claude-code
cases:
  files:
    - evals/cases/high-frequency-editor.yaml
    - evals/cases/long-form-reader.yaml
    - evals/cases/novel-coordination.yaml
    - evals/cases/scoped-feedback.yaml
    - evals/cases/mobile-field-app.yaml
  defaults:
    timeout_seconds: 900
    max_turns: 30
    collect_artifacts: ["prototype/**"]
  parallelism: 1
judge:
  type: rule_based
  success:
    - exit_code: 0
    - files_exist: [prototype/discussion.md]
    - files_not_exist:
        - prototype/index.html
        - prototype/app.js
        - DESIGN_SPEC.md
        - PRODUCT-DESIGN.md
        - prototype/README.md
report:
  formats: [json, html]
  artifacts: [transcript]
