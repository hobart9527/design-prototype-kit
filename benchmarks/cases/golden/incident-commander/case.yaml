id: incident-commander
category: enterprise-ops
difficulty: hard
suite: [golden, release]
tension_class: low_innovation

run_policy:
  repeats: 3
  timeout_seconds: 1800
  max_turns: 24
  max_budget_usd_per_turn: 6.0

variants:
  - no_skill
  - stable_skill
  - candidate_skill

surfaces:
  expected:
    - desktop
    - mobile

viewports:
  required: [390, 1280]

capabilities_under_test:
  - product_understanding
  - context_preservation
  - action_safety
  - dense_information
  - responsive
  - frontend_contract

evaluation:
  semantic: true
  task_trace: true
  visual_pairwise: true
  frontend_reproduction: true

method_expectation:
  must_consider:
    - context-preservation
    - action-verb-lifecycle
  relevant:
    - progressive-disclosure
    - dense-operational-console
  should_not_select:
    - form-ergonomics
    - editorial-rhythm
