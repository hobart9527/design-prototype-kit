id: incident-commander
category: enterprise-ops
difficulty: hard
suite: [golden, release]
tension_class: low_innovation

run_policy:
  repeats: 3
  # Three keyword-injected events make 4-5 calls the norm, not 3: r24 died at
  # exactly 1800.00s cumulative with turn 4 (mobile-read-only event) stranded
  # at its 118s remainder. 2400s prices the event cascade the case itself
  # defines; per-call budget and max_turns still bound runaway calls.
  timeout_seconds: 2400
  max_turns: 24
  max_budget_usd_per_turn: 8.0

variants:
  - no_skill
  - stable_skill
  - candidate_skill

surfaces:
  expected:
    - desktop
    - mobile

viewports:
  required: [390, 1280]

capabilities_under_test:
  - product_understanding
  - context_preservation
  - action_safety
  - dense_information
  - responsive
  - frontend_contract

evaluation:
  semantic: true
  task_trace: true
  visual_pairwise: true
  frontend_reproduction: true

method_expectation:
  must_consider:
    - context-preservation
    - action-verb-lifecycle
  relevant:
    - progressive-disclosure
    - dense-operational-console
  should_not_select:
    - form-ergonomics
    - editorial-rhythm
