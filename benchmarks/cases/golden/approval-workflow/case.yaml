id: approval-workflow
category: enterprise-internal-tooling
difficulty: medium
suite: [golden, daily]
tension_class: low_innovation

run_policy:
  repeats: 3
  timeout_seconds: 1500
  max_turns: 20
  max_budget_usd_per_turn: 6.0

variants:
  - no_skill
  - stable_skill
  - candidate_skill

surfaces:
  expected:
    - desktop

viewports:
  required: [1280]

capabilities_under_test:
  - product_understanding
  - restraint
  - review_lifecycle
  - dense_information
  - frontend_contract

evaluation:
  semantic: true
  task_trace: true
  visual_pairwise: true
  frontend_reproduction: false

method_expectation:
  must_consider:
    - action-verb-lifecycle
    - context-preservation
  relevant:
    - progressive-disclosure
  should_not_select:
    - editorial-rhythm
    - somatic-touch-feedback
