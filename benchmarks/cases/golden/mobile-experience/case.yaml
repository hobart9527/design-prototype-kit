id: mobile-experience
category: consumer-mobile-experience
difficulty: hard
suite: [golden, calibration]
tension_class: signature_opportunity

run_policy:
  repeats: 3
  timeout_seconds: 1800
  max_turns: 24
  max_budget_usd_per_turn: 8.0

variants:
  - no_skill
  - stable_skill
  - candidate_skill

surfaces:
  expected:
    - mobile

viewports:
  required: [390, 768]

capabilities_under_test:
  - product_understanding
  - touch_interaction
  - motion_and_feedback
  - sensory_coherence
  - responsive

evaluation:
  semantic: true
  task_trace: true
  visual_pairwise: true
  taste: true
  frontend_reproduction: false

method_expectation:
  must_consider:
    - touch-target-geometry
    - decisive-3-frame
  relevant:
    - progressive-disclosure
  should_not_select:
    - dense-operational-console
    - visual-rhythm-density
