id: content-studio
category: collaborative-content-workflow
difficulty: hard
suite: [golden, daily, calibration]
tension_class: signature_opportunity

run_policy:
  repeats: 3
  timeout_seconds: 1500
  max_turns: 20
  max_budget_usd_per_turn: 6.0

variants:
  - no_skill
  - stable_skill
  - candidate_skill

surfaces:
  expected:
    - desktop
    - mobile

viewports:
  required: [390, 1280]

capabilities_under_test:
  - product_understanding
  - version_integrity
  - contextual_comment_resolution
  - authorship_preservation
  - accessibility
  - responsive

evaluation:
  semantic: true
  task_trace: true
  visual_pairwise: true
  frontend_reproduction: false

method_expectation:
  must_consider:
    - context-preservation
    - action-verb-lifecycle
  relevant:
    - visual-rhythm-density
    - progressive-disclosure
  should_not_select:
    - dense-operational-console
