<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review Portal - Prototype Review Portal</title>
  <link rel="stylesheet" href="shared/tokens.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-void, #05070a);
      color: var(--text-primary, #e2e8f0);
      font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
      font-size: 13px;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .portal-nav {
      background: var(--bg-base, #0b0f17);
      border-bottom: 1px solid var(--border-dim, #1e293b);
      padding: var(--space-2, 8px) var(--space-4, 16px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 48px;
    }
    .portal-title {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .view-switcher {
      display: flex;
      background: var(--bg-surface, #0f172a);
      border: 1px solid var(--border-dim, #1e293b);
      border-radius: var(--radius-btn, 4px);
      padding: 2px;
      gap: 2px;
    }
    .view-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary, #94a3b8);
      padding: 6px 14px;
      font-family: var(--font-mono, monospace);
      font-size: 11px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.15s;
    }
    .view-btn:hover { color: var(--text-primary, #e2e8f0); }
    .view-btn.active {
      background: var(--accent-primary, #00f0ff);
      color: #000;
      font-weight: 600;
    }
    .viewport-tools {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .vp-btn {
      background: var(--bg-surface, #0f172a);
      border: 1px solid var(--border-dim, #1e293b);
      color: var(--text-secondary, #94a3b8);
      padding: 4px 8px;
      font-size: 11px;
      font-family: var(--font-mono, monospace);
      cursor: pointer;
      border-radius: 2px;
    }
    .vp-btn.active {
      border-color: var(--accent-primary, #00f0ff);
      color: var(--accent-primary, #00f0ff);
    }
    .portal-frame-box {
      flex: 1;
      width: 100%;
      height: calc(100vh - 48px - 36px);
      background: #000;
      display: flex;
      justify-content: center;
      align-items: stretch;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: var(--bg-void, #05070a);
      transition: width 0.2s ease;
    }
    .portal-status-bar {
      background: var(--bg-base, #0b0f17);
      border-top: 1px solid var(--border-dim, #1e293b);
      padding: 0 var(--space-4, 16px);
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono, monospace);
      font-size: 11px;
      color: var(--text-secondary, #94a3b8);
    }
    .status-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .indicator-green {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--status-running, #10b981);
      box-shadow: 0 0 6px var(--status-running, #10b981);
    }
  </style>
</head>
<body>
  <div class="portal-nav">
    <div class="portal-title">
      <span>PROTOTYPE REVIEW PORTAL // REVIEW PORTAL</span>
      <span style="font-family:var(--font-mono, monospace);font-size:11px;color:var(--text-secondary,#94a3b8)">[CANONICAL SPEC HARNESS]</span>
    </div>
    <div class="view-switcher">
      <button class="view-btn active" onclick="loadView('experiments/command-hero/anchor/index.html', this)">Core Anchor [command-hero]</button>
      <button class="view-btn" onclick="loadView('experiments/console/hero-anchor/index.html', this)">Core Anchor [console]</button>
      <button class="view-btn" onclick="loadView('experiments/editorial-reader/anchor/index.html', this)">Core Anchor [editorial-reader]</button>
      <button class="view-btn" onclick="loadView('experiments/incident-commander/anchor/index.html', this)">Core Anchor [incident-commander]</button>
      <button class="view-btn" onclick="loadView('experiments/incident-replay/hero-anchor/index.html', this)">Core Anchor [incident-replay]</button>
    </div>
    <div class="viewport-tools">
      <span style="font-size:11px;color:var(--text-secondary,#94a3b8)">VIEWPORT:</span>
      <button class="vp-btn active" onclick="setViewport('100%')">FULL</button>
      <button class="vp-btn" onclick="setViewport('1280px')">1280px</button>
      <button class="vp-btn" onclick="setViewport('768px')">768px</button>
      <button class="vp-btn" onclick="setViewport('375px')">375px</button>
    </div>
  </div>

  <div class="portal-frame-box">
    <iframe id="preview-frame" src="experiments/command-hero/anchor/index.html"></iframe>
  </div>

  <div class="portal-status-bar">
    <div class="status-item">
      <div class="indicator-green"></div>
      <span>QUALITY HARNESS: VERIFIED · Multi-viewport screenshots captured (320, 390, 1280px)</span>
    </div>
    <div class="status-item">
      <span>SHORTCUTS: [SPACE/P: DRAIN] [ESC: CLOSE] [J/K: SELECT]</span>
    </div>
    <div class="status-item">
      <span>DTCG TOKENS: FROZEN</span>
    </div>
  </div>

  <script>
    function loadView(url, btn) {
      document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('preview-frame').src = url;
    }

    function setViewport(w) {
      document.querySelectorAll('.vp-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('preview-frame').style.width = w;
    }
  </script>
</body>
</html>
