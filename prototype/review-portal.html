<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unified Review Portal - Production Prototype Rigor</title>
  <link rel="stylesheet" href="shared/tokens.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-void);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13px;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .portal-nav {
      background: var(--bg-base);
      border-bottom: 1px solid var(--border-dim);
      padding: var(--space-2) var(--space-4);
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 48px;
    }
    .portal-title {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .view-switcher {
      display: flex;
      background: var(--bg-surface);
      border: 1px solid var(--border-dim);
      border-radius: var(--radius-btn);
      padding: 2px;
      gap: 2px;
    }
    .view-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 6px 14px;
      font-family: var(--font-mono);
      font-size: 11px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.15s;
    }
    .view-btn:hover { color: var(--text-primary); }
    .view-btn.active {
      background: var(--accent-primary);
      color: #000;
      font-weight: 600;
    }
    .portal-frame-box {
      flex: 1;
      width: 100%;
      height: calc(100vh - 48px - 36px);
      background: #000;
      position: relative;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .portal-status-bar {
      background: var(--bg-base);
      border-top: 1px solid var(--border-dim);
      padding: 0 var(--space-4);
      height: 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-secondary);
    }
    .status-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .indicator-green {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--status-running);
      box-shadow: 0 0 6px var(--status-running);
    }
  </style>
</head>
<body>
  <div class="portal-nav">
    <div class="portal-title">
      <span>AGENT PIPELINE CONSOLE // REVIEW PORTAL</span>
      <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)">[RUN 02 - FOUR PILLARS VERIFIED // DECISIVE 3-FRAME]</span>
    </div>
    <div class="view-switcher">
      <button class="view-btn active" onclick="loadView('experiments/console/hero-anchor/index.html', this)">Primary Hero Anchor</button>
      <button class="view-btn" onclick="loadView('surfaces/incident-replay/index.html', this)">Contextual Incident Replay</button>
      <button class="view-btn" onclick="loadView('surfaces/capacity-matrix/index.html', this)">Supporting Capacity Matrix</button>
    </div>
  </div>

  <div class="portal-frame-box">
    <iframe id="preview-frame" src="experiments/console/hero-anchor/index.html"></iframe>
  </div>

  <div class="portal-status-bar">
    <div class="status-item">
      <div class="indicator-green"></div>
      <span>AUTOMATED QUALITY HARNESS: 5/5 PASSED</span>
    </div>
    <div class="status-item">
      <span>MICRO-APP ARCHITECTURE: CENTRALIZED APPSTATE ACTIVE</span>
    </div>
    <div class="status-item">
      <span>PROMPT LEDGER: AUDITED</span>
    </div>
  </div>

  <script>
    function loadView(url, btn) {
      document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('preview-frame').src = url;
    }
  </script>
</body>
</html>
